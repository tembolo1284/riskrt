[workspace]
resolver = "3"
members = [
    "crates/riskrt-core",
    "crates/riskrt-feed",
    "crates/riskrt-market",
    "crates/riskrt-curves",
    "crates/riskrt-deps",
    "crates/riskrt-pricing",
    "crates/riskrt-sched",
    "crates/riskrt-agg",
    "crates/riskrt-engine",
    "crates/riskrt-cli",
    "crates/riskrt-proto",
    "crates/riskrt-grpc",
    # append as they land: scenario
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
riskrt-core = { path = "crates/riskrt-core" }
riskrt-feed = { path = "crates/riskrt-feed" }
riskrt-market = { path = "crates/riskrt-market" }
riskrt-curves = { path = "crates/riskrt-curves" }
riskrt-deps = { path = "crates/riskrt-deps" }
riskrt-pricing = { path = "crates/riskrt-pricing" }
riskrt-sched = { path = "crates/riskrt-sched" }
riskrt-agg = { path = "crates/riskrt-agg" }
riskrt-engine = { path = "crates/riskrt-engine" }
riskrt-proto  = { path = "crates/riskrt-proto" }
riskrt-grpc   = { path = "crates/riskrt-grpc" }

# Pricing kernel: ferrumquant checked out next to this repo.
fq-core  = { path = "../ferrumquant/crates/fq-core" }
fq-rates = { path = "../ferrumquant/crates/fq-rates" }

arc-swap  = "1"
crossbeam = "0.8"
rayon     = "1"
clap      = { version = "4", features = ["derive"] }

# gRPC surface (riskrt-proto, riskrt-grpc only).
prost             = "0.14"
tonic             = "0.14"
tonic-prost       = "0.14"
tonic-prost-build = "0.14"
protox            = "0.10"
tokio             = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tokio-stream      = { version = "0.1", features = ["net"] }

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"   # usable perf/flamegraph output

[profile.bench]
inherits = "release"
